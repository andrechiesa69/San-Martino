<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" width="360" height="220">
  <rect width="360" height="220" fill="#236ed5" />
  <style>
    .label {
      font-family: 'Montserrat', 'Arial', 'Helvetica Neue', sans-serif;
      font-weight: 700;
      font-size: 25px;
      fill: #ffffff;
      text-anchor: middle;
      letter-spacing: 0.5px;
    }
    .icon-stroke {
      fill: none;
      stroke: #ffffff;
      stroke-width: 4.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .icon-thin {
      fill: none;
      stroke: #ffffff;
      stroke-width: 3.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
  <g transform="translate(180, 90)">
    <polygon points="0,-44 38,-22 38,22 0,44 -38,22 -38,-22" class="icon-stroke" />
    <polyline points="-38,-22 0,0 38,-22" class="icon-stroke" />
    <line x1="0" y1="0" x2="0" y2="44" class="icon-stroke" />
    <polyline points="-19,-33 19,-11 19,2" class="icon-thin" />
    <polygon points="-27,-3 -13,5 -13,17 -27,9" class="icon-thin" />
  </g>
  <text x="180" y="165" class="label">CONFEZIONAMENTO</text>
</svg>