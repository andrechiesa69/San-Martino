<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>San Martino Cooperativa – AR</title>

<!-- Librerie: three.js + MindAR (tracking immagine) -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
    "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
  }
}
</script>

<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    -webkit-user-select: none; user-select: none;
    overscroll-behavior: none;
  }
  /* touch-action:none = lo zoom con due dita lo gestiamo noi (uguale su iOS e Android) */
  #ar { position: fixed; inset: 0; overflow: hidden; transform-origin: 0 0; touch-action: none; }
  #ar canvas { pointer-events: none; }

  /* =========================================================
     MIRINO DI SCANSIONE (angoli bianchi)
     ========================================================= */
  #scan {
    position: fixed; inset: 0; z-index: 20; pointer-events: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity .35s ease;
  }
  #scan.off { opacity: 0; }
  #scan .frame {
    position: relative;
    height: min(68vh, calc(84vw * 1786 / 989));
    aspect-ratio: 989 / 1786;           /* stesse proporzioni della pagina */
    overflow: hidden;
  }
  #scan .c {
    position: absolute; width: 44px; height: 44px;
    border: 5px solid #fff; box-sizing: border-box;
    filter: drop-shadow(0 0 6px rgba(0,0,0,.45));
  }
  #scan .tl { top: 0; left: 0;  border-right: 0; border-bottom: 0; border-top-left-radius: 14px; }
  #scan .tr { top: 0; right: 0; border-left: 0;  border-bottom: 0; border-top-right-radius: 14px; }
  #scan .bl { bottom: 0; left: 0;  border-right: 0; border-top: 0; border-bottom-left-radius: 14px; }
  #scan .br { bottom: 0; right: 0; border-left: 0;  border-top: 0; border-bottom-right-radius: 14px; }
  #scan .line {
    position: absolute; left: 6%; right: 6%; top: 0; height: 3px; border-radius: 3px;
    background: linear-gradient(90deg, transparent, #fff, transparent);
    box-shadow: 0 0 14px 2px rgba(255,255,255,.75);
    animation: scanline 2.4s ease-in-out infinite alternate;
  }
  @keyframes scanline { from { top: 3%; } to { top: 96%; } }
  #scan p {
    margin: 18px 0 0; padding: 9px 18px; border-radius: 999px;
    color: #fff; font-size: 15px; font-weight: 600; letter-spacing: .2px;
    background: rgba(0,0,0,.5);
  }

  /* pulsante per azzerare lo zoom */
  #zoom-reset {
    position: fixed; z-index: 25; right: 16px; bottom: calc(18px + env(safe-area-inset-bottom));
    display: none; padding: 10px 16px; border: 0; border-radius: 999px;
    background: rgba(0,0,0,.6); color: #fff; font-size: 15px; font-weight: 700;
  }
  #zoom-reset.on { display: block; }

  /* =========================================================
     LIQUID GLASS comune (scritta in basso + pulsante "Clicca qui")
     ========================================================= */
  .lg {
    background:
      radial-gradient(120% 100% at 50% -30%, rgba(255,255,255,.38) 0%, rgba(255,255,255,0) 60%),
      linear-gradient(135deg, rgba(255,255,255,.30) 0%, rgba(255,255,255,.08) 40%, rgba(255,255,255,.05) 65%, rgba(255,255,255,.22) 100%);
    -webkit-backdrop-filter: blur(14px) saturate(180%) brightness(1.08);
            backdrop-filter: blur(14px) saturate(180%) brightness(1.08);
    border: 1.5px solid rgba(255,255,255,.65);
    box-shadow:
      inset 0 2px 1px rgba(255,255,255,.95),
      inset 0 -2px 2px rgba(255,255,255,.35),
      inset 0 -12px 18px rgba(255,255,255,.12),
      0 10px 26px rgba(4,24,74,.35),
      0 2px 6px rgba(4,24,74,.25);
    color: #fff;
    text-shadow: 0 1px 3px rgba(4,24,74,.55);
    position: relative; overflow: hidden;
  }
  .lg::after {                                          /* riflesso che scorre */
    content: ""; position: absolute; top: -50%; left: -60%; width: 35%; height: 200%;
    background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.5), rgba(255,255,255,0));
    transform: rotate(18deg); pointer-events: none;
    animation: lgSheen 4.5s ease-in-out infinite;
  }
  @keyframes lgSheen { 0%, 60% { left: -60%; } 100% { left: 140%; } }

  /* scritta "Clicca sui loghi" in fondo allo schermo */
  #hint {
    position: fixed; z-index: 22; left: 50%;
    bottom: calc(22px + env(safe-area-inset-bottom));
    padding: 9px 20px; border-radius: 999px;
    font-size: 15px; font-weight: 700; letter-spacing: .3px; white-space: nowrap;
    pointer-events: none;
    opacity: 0; transform: translate(-50%, 16px);
    transition: opacity .3s ease, transform .3s ease;
  }
  #hint.on {
    opacity: 1; transform: translate(-50%, 0);
    transition: opacity .6s ease 3.6s, transform .6s cubic-bezier(.2,.9,.3,1.2) 3.6s;   /* dopo l'arrivo dei rettangoli */
  }

  /* pannello per il sito principale: AR sfocata dietro, pulsante al centro */
  #home {
    position: fixed; inset: 0; z-index: 40; display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: 22px;
    background: rgba(10,40,100,.25);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  }
  #home.on { display: flex; }
  #home-go {
    display: block; padding: 20px 46px; border-radius: 999px;
    font-size: 21px; font-weight: 800; letter-spacing: .4px; text-decoration: none;
    animation: goIn .55s cubic-bezier(.2,.9,.3,1.25) both;
  }
  #home-go:active { filter: brightness(1.25); transform: scale(.97); }
  @keyframes goIn { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: none; } }
  #home-back {
    padding: 11px 20px; border-radius: 999px; border: 0;
    font-size: 15px; font-weight: 700;
  }

  /* Messaggio di errore (fotocamera negata, ecc.) */
  #msg {
    position: fixed; inset: 0; z-index: 30; display: none;
    align-items: center; justify-content: center; text-align: center;
    padding: 32px; box-sizing: border-box; color: #fff; font-size: 17px; line-height: 1.45;
    background: #123a7a;
  }
  #msg.on { display: flex; }
  #msg button {
    margin-top: 20px; padding: 12px 26px; border: 0; border-radius: 999px;
    background: #fff; color: #123a7a; font-size: 16px; font-weight: 700;
  }

  /* =========================================================
     SITO APERTO SOPRA L'AR + PULSANTE PER TORNARE
     ========================================================= */
  #site {
    position: fixed; inset: 0; z-index: 40; display: none; flex-direction: column;
    background: #fff;
  }
  #site.on { display: flex; }
  #site .bar {
    flex: 0 0 auto; display: flex; align-items: center; gap: 10px;
    padding: calc(8px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) 8px calc(10px + env(safe-area-inset-left));
    background: #1d55b0;
  }
  #back {
    flex: 1 1 auto; min-height: 46px; padding: 0 16px; border: 0; border-radius: 999px;
    background: #fff; color: #1d55b0; font-size: 16px; font-weight: 700; text-align: center;
  }
  #ext {
    flex: 0 0 auto; min-height: 46px; display: flex; align-items: center; padding: 0 12px;
    color: #fff; font-size: 13px; font-weight: 600; text-decoration: underline;
  }
  #frame-box { flex: 1 1 auto; position: relative; min-height: 0; overflow: auto; -webkit-overflow-scrolling: touch; }
  #frame-box iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }

  /* =========================================================
     SCENA AR
     1000px di larghezza = larghezza della pagina stampata.
     Altezza = 1000 * 1786 / 989 (proporzioni del target).
     ========================================================= */
  #stage {
    width: 1000px; height: 1806px;
    visibility: hidden;                 /* visibile solo quando il target è agganciato */
    -webkit-backface-visibility: hidden; backface-visibility: hidden;
  }
  #stage > * { position: absolute; display: block; }
  #stage img { -webkit-user-drag: none; pointer-events: none; }

  /* ---------- 1) PIRAMIDE ---------- */
  #piramide {
    left: 205.8px; top: 199.2px; width: 727.4px; height: auto;
    opacity: 0; transform-origin: 50% 60%;
  }
  .play #piramide { animation: pyrIn .9s cubic-bezier(.2,.9,.25,1.15) both; }
  @keyframes pyrIn {
    from { opacity: 0; transform: scale(.82) translateY(40px); }
    to   { opacity: 1; transform: none; }
  }

  /* ---------- 2) LENTE "LIQUID GLASS" SOPRA IL LOGO STAMPATO ---------- */
  /* vetro trasparente: il logo San Martino della pagina si vede attraverso */
  #lens {
    left: 100px; top: 944px; width: 846px; height: 226px; border-radius: 84px;
    box-sizing: border-box; overflow: hidden; pointer-events: none;
    background:
      radial-gradient(120% 90% at 50% -20%, rgba(255,255,255,.34) 0%, rgba(255,255,255,0) 55%),
      linear-gradient(135deg, rgba(255,255,255,.26) 0%, rgba(255,255,255,.04) 35%, rgba(255,255,255,.02) 65%, rgba(255,255,255,.20) 100%);
    -webkit-backdrop-filter: blur(1.5px) saturate(175%) brightness(1.14) contrast(1.06);
            backdrop-filter: blur(1.5px) saturate(175%) brightness(1.14) contrast(1.06);
    border: 2px solid rgba(255,255,255,.7);
    box-shadow:
      inset 0 3px 2px rgba(255,255,255,.95),          /* bordo alto lucido */
      inset 0 -3px 3px rgba(255,255,255,.45),
      inset 10px 0 16px rgba(255,255,255,.20),
      inset -10px 0 16px rgba(255,255,255,.20),
      inset 0 -26px 34px rgba(255,255,255,.12),
      inset 0 22px 30px rgba(255,255,255,.10),
      0 20px 40px rgba(4,24,74,.38),
      0 3px 8px rgba(4,24,74,.28);
    opacity: 0;
  }
  #lens::after {                                       /* riflesso che scorre */
    content: ""; position: absolute; top: -40%; left: -40%; width: 22%; height: 180%;
    background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.6), rgba(255,255,255,0));
    transform: rotate(18deg);
  }
  .play #lens { pointer-events: auto; }
  .play #lens { animation: lensIn 1.1s cubic-bezier(.2,.9,.25,1) 1.0s both; }
  .play #lens::after { animation: lensSheen 5s ease-in-out 2.2s infinite; }
  @keyframes lensIn {                                  /* nasce come una goccia e si allarga */
    0%   { opacity: 0; transform: scale(.12, .5);  border-radius: 113px; }
    30%  { opacity: 1; }
    60%  { transform: scale(1.06, .94); }
    80%  { transform: scale(.98, 1.03); }
    100% { opacity: 1; transform: none; border-radius: 84px; }
  }
  @keyframes lensSheen {
    0%, 60% { left: -40%; }
    100%    { left: 125%; }
  }

  /* ---------- 3) I 6 RETTANGOLI "LIQUID GLASS" ---------- */
  .glass {
    width: 302px; height: 190px; box-sizing: border-box; padding: 22px 30px;
    border-radius: 38px;
    background:
      linear-gradient(135deg, rgba(255,255,255,.42) 0%, rgba(255,255,255,.10) 38%, rgba(255,255,255,.06) 62%, rgba(255,255,255,.30) 100%);
    -webkit-backdrop-filter: blur(18px) saturate(180%) brightness(1.1);
            backdrop-filter: blur(18px) saturate(180%) brightness(1.1);
    border: 1.5px solid rgba(255,255,255,.62);
    box-shadow:
      inset 0 2px 1px rgba(255,255,255,.95),          /* riflesso sul bordo alto */
      inset 0 -2px 2px rgba(255,255,255,.35),
      inset 3px 0 6px rgba(255,255,255,.22),
      inset -3px 0 6px rgba(255,255,255,.22),
      inset 0 -18px 26px rgba(255,255,255,.12),
      0 16px 34px rgba(4,24,74,.42),
      0 2px 6px rgba(4,24,74,.30);
    overflow: hidden;
    opacity: 0; pointer-events: none;
    text-decoration: none;
    transition: filter .15s;
  }
  .glass img {
    position: relative; z-index: 1;
    display: block; width: 100%; height: 100%; object-fit: cover;
    border-radius: 20px;
    box-shadow: 0 3px 10px rgba(4,24,74,.35);
  }
  /* riflesso che scorre sul vetro */
  .glass::after {
    content: ""; position: absolute; z-index: 2; top: -40%; left: -70%; width: 46%; height: 180%;
    background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.55), rgba(255,255,255,0));
    transform: rotate(18deg); pointer-events: none;
  }
  .glass:active { filter: brightness(1.25); }

  .play .glass {
    pointer-events: auto;
    animation: glassIn 1.15s cubic-bezier(.16,.9,.24,1.08) both;
    animation-delay: calc(2.2s + var(--i) * .17s);
  }
  .play .glass::after {
    animation: sheen 4.2s ease-in-out infinite;
    animation-delay: calc(4.0s + var(--i) * .25s);
  }
  @keyframes glassIn {          /* arrivano roteando */
    0%   { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(var(--rot)) scale(.12); }
    35%  { opacity: 1; }
    100% { opacity: 1; transform: none; }
  }
  @keyframes sheen {
    0%, 55% { left: -70%; }
    100%    { left: 150%; }
  }

  /* posizioni: griglia 3 x 2 sopra i sei servizi stampati */
  .g1 { left: 38px;  top: 1173px; --i: 0; --dx: -520px; --dy: -260px; --rot: -720deg; }
  .g2 { left: 349px; top: 1173px; --i: 1; --dx: 0px;    --dy: -520px; --rot:  720deg; }
  .g3 { left: 660px; top: 1173px; --i: 2; --dx: 520px;  --dy: -260px; --rot: -720deg; }
  .g4 { left: 38px;  top: 1383px; --i: 3; --dx: -520px; --dy: 300px;  --rot:  720deg; }
  .g5 { left: 349px; top: 1383px; --i: 4; --dx: 0px;    --dy: 520px;  --rot: -720deg; }
  .g6 { left: 660px; top: 1383px; --i: 5; --dx: 520px;  --dy: 300px;  --rot:  720deg; }
</style>
</head>
<body>

<!-- Fotocamera + AR -->
<div id="ar"></div>

<!-- Contenuto AR agganciato alla pagina -->
<div id="stage">
  <img id="piramide" src="./piramide_def.png" alt="">

  <!-- lente di vetro sopra il logo stampato: porta al sito principale -->
  <a id="lens" href="https://coopsanmartino.it/" data-home="1" draggable="false" aria-label="San Martino Cooperativa"></a>

  <a class="glass g1" draggable="false" href="https://coopsanmartino.it/servizi/servizi-logistici/"><img src="./01_servizi_logistici.svg" alt="Servizi logistici"></a>
  <a class="glass g2" draggable="false" href="https://coopsanmartino.it/servizi/confezionamento/"><img src="./02_confezionamento.svg" alt="Confezionamento"></a>
  <a class="glass g3" draggable="false" href="https://coopsanmartino.it/servizi/sanificazioni/"><img src="./03_sanificazioni.svg" alt="Sanificazioni"></a>
  <a class="glass g4" draggable="false" href="https://coopsanmartino.it/servizi/pulizie-edifici/"><img src="./04_pulizie_edifici.svg" alt="Pulizie edifici"></a>
  <a class="glass g5" draggable="false" href="https://coopsanmartino.it/servizi/manutenzione/"><img src="./05_manutenzione.svg" alt="Manutenzione"></a>
  <a class="glass g6" draggable="false" href="https://coopsanmartino.it/servizi/fiere-ed-eventi/"><img src="./06_fiere_ed_eventi.svg" alt="Fiere ed eventi"></a>
</div>

<!-- Mirino di scansione -->
<div id="scan">
  <div class="frame">
    <span class="c tl"></span><span class="c tr"></span>
    <span class="c bl"></span><span class="c br"></span>
    <span class="line"></span>
  </div>
  <p>Inquadra la pagina</p>
</div>

<button id="zoom-reset" type="button">Zoom 1×</button>

<!-- Scritta in basso -->
<div id="hint" class="lg">Clicca sui loghi</div>

<!-- Sito principale: pulsante "Clicca qui" al centro -->
<div id="home">
  <a id="home-go" class="lg" href="https://coopsanmartino.it/" target="_blank" rel="noopener">Clicca qui</a>
  <button id="home-back" class="lg" type="button">‹ Torna alla realtà aumentata</button>
</div>

<!-- Sito aperto sopra l'AR -->
<div id="site">
  <div class="bar">
    <button id="back" type="button">‹ Torna alla realtà aumentata</button>
    <a id="ext" target="_blank" rel="noopener">Apri nel browser</a>
  </div>
  <div id="frame-box"></div>
</div>

<!-- Errori -->
<div id="msg"><div>
  <div id="msg-text"></div>
  <button onclick="location.reload()">Riprova</button>
</div></div>

<script type="module">
  import { Vector3, Quaternion } from 'three';
  import { MindARThree } from 'mindar-image-three';
  import { CSS3DObject } from 'three/addons/renderers/CSS3DRenderer.js';

  const ar    = document.getElementById('ar');
  const stage = document.getElementById('stage');
  const hint  = document.getElementById('hint');
  const home  = document.getElementById('home');
  const scan  = document.getElementById('scan');
  const site  = document.getElementById('site');

  function showError(text) {
    document.getElementById('msg-text').textContent = text;
    document.getElementById('msg').classList.add('on');
    scan.classList.add('off');
  }

  /* =========================================================
     ZOOM CON DUE DITA (iOS e Android) + trascinamento quando è ingrandito
     ========================================================= */
  const zoomBtn = document.getElementById('zoom-reset');
  const pts = new Map();
  let z = 1, tx = 0, ty = 0, g = null, dragged = false;

  function applyZoom() {
    const w = window.innerWidth, h = window.innerHeight;
    tx = Math.min(0, Math.max(w * (1 - z), tx));
    ty = Math.min(0, Math.max(h * (1 - z), ty));
    ar.style.transform = z > 1.001 ? `translate(${tx}px, ${ty}px) scale(${z})` : '';
    zoomBtn.classList.toggle('on', z > 1.001);
  }
  function gestureInfo() {
    const a = [...pts.values()];
    const c = { x: 0, y: 0 };
    a.forEach(p => { c.x += p.x / a.length; c.y += p.y / a.length; });
    const d = a.length > 1 ? Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y) : 0;
    return { c, d, n: a.length };
  }
  function gestureStart() {
    g = pts.size ? { ...gestureInfo(), z, tx, ty } : null;
  }
  ar.addEventListener('pointerdown', (e) => {
    if (pts.size === 0) dragged = false;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    gestureStart();
  });
  ar.addEventListener('pointermove', (e) => {
    if (!pts.has(e.pointerId) || !g) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const now = gestureInfo();
    if (now.n >= 2 && g.d > 0) {                         // pizzico: ingrandisce attorno alle dita
      dragged = true;
      const nz = Math.min(4, Math.max(1, g.z * now.d / g.d));
      const px = (g.c.x - g.tx) / g.z, py = (g.c.y - g.ty) / g.z;
      z = nz; tx = now.c.x - nz * px; ty = now.c.y - nz * py;
      applyZoom();
    } else if (z > 1.001) {                              // un dito: sposta l'immagine ingrandita
      const dx = now.c.x - g.c.x, dy = now.c.y - g.c.y;
      if (Math.hypot(dx, dy) > 10) dragged = true;
      if (dragged) { tx = g.tx + dx; ty = g.ty + dy; applyZoom(); }
    }
  });
  const pointerEnd = (e) => { pts.delete(e.pointerId); gestureStart(); };
  ar.addEventListener('pointerup', pointerEnd);
  ar.addEventListener('pointercancel', pointerEnd);
  zoomBtn.addEventListener('click', () => { z = 1; tx = ty = 0; applyZoom(); });
  window.addEventListener('resize', applyZoom);
  // blocca lo zoom "di sistema" di Safari, che si sommerebbe al nostro
  ['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, e => e.preventDefault()));

  /* =========================================================
     AR
     ========================================================= */
  let mindar = null, anchor = null, tracking = false, lostTimer = null, stoppedAt = 0;

  async function start() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showError('Questo browser non permette di usare la fotocamera. Apri il link con Safari (iPhone) o Chrome (Android).');
      return;
    }

    mindar = new MindARThree({
      container: ar,
      imageTargetSrc: './targets.mind',
      uiScanning: 'no',          // usiamo il nostro mirino con gli angoli bianchi
      uiLoading: 'yes',
      uiError: 'no',
      missTolerance: 8,          // tollera qualche fotogramma perso prima di nascondere l'AR
      warmupTolerance: 3
    });
    const { renderer, cssRenderer, cssScene, camera } = mindar;

    // MindAR aggiorna "anchor.group"; la scena HTML lo insegue in modo ammorbidito,
    // così il tremolio del tracking non arriva ai rettangoli di vetro.
    anchor = mindar.addCSSAnchor(0);
    const obj = new CSS3DObject(stage);
    cssScene.add(obj);

    const tp = new Vector3(), ts = new Vector3(), tq = new Quaternion();
    let fresh = true, lastT = 0;

    anchor.onTargetFound = () => {
      if (panelOpen()) { anchor.visible = false; return; }   // sito aperto: AR in pausa
      clearTimeout(lostTimer);
      tracking = true; fresh = true;
      scan.classList.add('off');
      hint.classList.add('on');
      stage.classList.add('play');             // sequenza: piramide → lente di vetro → 6 rettangoli
    };
    anchor.onTargetLost = () => {
      tracking = false;
      stage.style.visibility = 'hidden';
      scan.classList.remove('off');
      hint.classList.remove('on');
      // se la pagina resta fuori inquadratura per un po', la sequenza riparte da capo
      lostTimer = setTimeout(() => stage.classList.remove('play'), 2500);
    };

    try {
      await mindar.start();
    } catch (e) {
      console.error(e);
      showError('Per vedere la realtà aumentata devi consentire l\'uso della fotocamera. Controlla i permessi e riprova.');
      return;
    }

    renderer.setAnimationLoop((t) => {
      const dt = Math.min(100, t - lastT || 16.7); lastT = t;
      if (tracking) {
        anchor.group.matrix.decompose(tp, tq, ts);
        if (fresh) {
          obj.position.copy(tp); obj.quaternion.copy(tq); obj.scale.copy(ts);
          stage.style.visibility = 'visible';
          fresh = false;
        } else {
          // fermo = molto ammorbidito (niente tremolio); movimento vero = segue subito
          const move = obj.position.distanceTo(tp) / Math.max(1e-6, tp.length());
          const turn = obj.quaternion.angleTo(tq);
          const base = Math.min(0.55, 0.05 + 9 * move + 1.6 * turn);
          const k = 1 - Math.pow(1 - base, dt / 16.7);
          obj.position.lerp(tp, k);
          obj.quaternion.slerp(tq, k);
          obj.scale.lerp(ts, k);
        }
      }
      cssRenderer.render(cssScene, camera);
    });

    // quando si torna alla pagina la fotocamera riparte
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) return;
      const v = ar.querySelector('video');
      if (v && v.paused) v.play().catch(() => location.reload());
    });
  }

  /* =========================================================
     LINK: il sito si apre sopra l'AR, con il pulsante per tornare
     ========================================================= */
  const frameBox = document.getElementById('frame-box');
  const ext = document.getElementById('ext');

  function openSite(url, isHome) {
    clearTimeout(lostTimer);
    hint.classList.remove('on');
    if (isHome) {
      // il sito principale non si lascia mostrare dentro la pagina: pulsante "Clicca qui"
      home.classList.add('on');
    } else {
      frameBox.innerHTML = '';
      const f = document.createElement('iframe');
      f.title = 'San Martino Cooperativa';
      f.src = url;
      frameBox.appendChild(f);
      ext.href = url;
      site.classList.add('on');
    }
    // AR in pausa mentre si guarda il sito (la fotocamera resta pronta)
    try { mindar.controller.stopProcessVideo(); } catch (e) {}
    stoppedAt = performance.now();
    anchor.visible = false;                     // così, al ritorno, il target viene "ritrovato" da capo
    tracking = false;
    stage.style.visibility = 'hidden';
    history.pushState({ site: true }, '');      // il tasto "indietro" di Android chiude il sito
  }
  function panelOpen() { return site.classList.contains('on') || home.classList.contains('on'); }
  function closeSite() {
    if (!panelOpen()) return;
    site.classList.remove('on');
    home.classList.remove('on');
    frameBox.innerHTML = '';
    scan.classList.remove('off');
    const v = mindar && mindar.video;
    if (v && v.paused) v.play().catch(() => {});
    // riavvio del tracking (con un attimo di margine se il sito è stato chiuso subito)
    const wait = Math.max(0, 400 - (performance.now() - stoppedAt));
    setTimeout(() => {
      if (panelOpen()) return;
      anchor.visible = false; tracking = false; stage.style.visibility = 'hidden';
      try { mindar.controller.processVideo(mindar.video); } catch (e) { location.reload(); }
    }, wait);
  }
  document.getElementById('back').addEventListener('click', closeSite);
  document.getElementById('home-back').addEventListener('click', closeSite);
  window.addEventListener('popstate', closeSite);

  // tocco su un link dell'AR (ignorato se si stava ingrandendo o trascinando)
  stage.addEventListener('click', (e) => {
    const a = e.target.closest('a[href]');
    if (!a) return;
    e.preventDefault();
    if (dragged) return;
    openSite(a.href, a.dataset.home === '1');
  });

  window.addEventListener('pageshow', (e) => { if (e.persisted) location.reload(); });

  start();
</script>
</body>
</html>
