<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>San Martino Cooperativa – AR</title>

<!-- Librerie: three.js + MindAR (tracking immagine) -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
    "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
  }
}
</script>

<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    -webkit-user-select: none; user-select: none;
    overscroll-behavior: none;
    touch-action: manipulation;
  }
  #ar { position: fixed; inset: 0; overflow: hidden; }
  #ar canvas { pointer-events: none; }

  /* =========================================================
     MIRINO DI SCANSIONE (angoli bianchi)
     ========================================================= */
  #scan {
    position: fixed; inset: 0; z-index: 20; pointer-events: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity .35s ease;
  }
  #scan.off { opacity: 0; }
  #scan .frame {
    position: relative;
    height: min(68vh, calc(84vw * 1786 / 989));
    aspect-ratio: 989 / 1786;           /* stesse proporzioni della pagina */
    overflow: hidden;
  }
  #scan .c {
    position: absolute; width: 44px; height: 44px;
    border: 5px solid #fff; box-sizing: border-box;
    filter: drop-shadow(0 0 6px rgba(0,0,0,.45));
  }
  #scan .tl { top: 0; left: 0;  border-right: 0; border-bottom: 0; border-top-left-radius: 14px; }
  #scan .tr { top: 0; right: 0; border-left: 0;  border-bottom: 0; border-top-right-radius: 14px; }
  #scan .bl { bottom: 0; left: 0;  border-right: 0; border-top: 0; border-bottom-left-radius: 14px; }
  #scan .br { bottom: 0; right: 0; border-left: 0;  border-top: 0; border-bottom-right-radius: 14px; }
  #scan .line {
    position: absolute; left: 6%; right: 6%; top: 0; height: 3px; border-radius: 3px;
    background: linear-gradient(90deg, transparent, #fff, transparent);
    box-shadow: 0 0 14px 2px rgba(255,255,255,.75);
    animation: scanline 2.4s ease-in-out infinite alternate;
  }
  @keyframes scanline { from { top: 3%; } to { top: 96%; } }
  #scan p {
    margin: 18px 0 0; padding: 9px 18px; border-radius: 999px;
    color: #fff; font-size: 15px; font-weight: 600; letter-spacing: .2px;
    background: rgba(0,0,0,.42);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  }

  /* Messaggio di errore (fotocamera negata, ecc.) */
  #msg {
    position: fixed; inset: 0; z-index: 30; display: none;
    align-items: center; justify-content: center; text-align: center;
    padding: 32px; box-sizing: border-box; color: #fff; font-size: 17px; line-height: 1.45;
    background: #123a7a;
  }
  #msg.on { display: flex; }
  #msg button {
    margin-top: 20px; padding: 12px 26px; border: 0; border-radius: 999px;
    background: #fff; color: #123a7a; font-size: 16px; font-weight: 700;
  }

  /* =========================================================
     SCENA AR
     1000px di larghezza = larghezza della pagina stampata.
     Altezza = 1000 * 1786 / 989 (proporzioni del target).
     ========================================================= */
  #stage {
    width: 1000px; height: 1806px;
    visibility: hidden;                 /* MindAR la rende visibile quando aggancia il target */
  }
  #stage > * { position: absolute; display: block; }
  #stage img { -webkit-user-drag: none; pointer-events: none; }

  /* ---------- 1) PIRAMIDE ---------- */
  #piramide {
    left: 205.8px; top: 199.2px; width: 727.4px; height: auto;
    opacity: 0; transform-origin: 50% 60%;
  }
  .play #piramide { animation: pyrIn .9s cubic-bezier(.2,.9,.25,1.15) both; }
  @keyframes pyrIn {
    from { opacity: 0; transform: scale(.82) translateY(40px); }
    to   { opacity: 1; transform: none; }
  }

  /* ---------- 2) SCRITTA SAN MARTINO: flash + neon ---------- */
  /* fondo blu che copre il logo stampato, così la scritta neon risalta */
  #plate {
    left: 112px; top: 950px; width: 820px; height: 222px; border-radius: 40px;
    background: radial-gradient(ellipse at 50% 45%, #2b6fd0 0%, #1d55b0 70%, #1a4da3 100%);
    box-shadow: 0 0 28px 18px #1f5ab6;
    opacity: 0;
  }
  .play #plate { animation: fadeIn .35s ease-out 1.0s both; }
  @keyframes fadeIn { to { opacity: 1; } }

  #flash {
    left: 20px; top: 860px; width: 1000px; height: 400px; border-radius: 50%;
    background: radial-gradient(ellipse at center, #fff 0%, rgba(255,255,255,.85) 22%, rgba(160,215,255,.45) 45%, rgba(255,255,255,0) 70%);
    opacity: 0; pointer-events: none;
  }
  .play #flash { animation: flash .75s ease-out 1.15s both; }
  @keyframes flash {
    0%   { opacity: 0;   transform: scale(.25, .4); }
    18%  { opacity: 1;   transform: scale(1.05, 1); }
    100% { opacity: 0;   transform: scale(1.5, 1.25); }
  }

  #scritta {
    left: 39.9px; top: 724.2px; width: 1109.4px; height: auto;
    opacity: 0;
    filter: drop-shadow(0 0 5px #fff) drop-shadow(0 0 16px #7fd4ff) drop-shadow(0 0 38px #2aa0ff);
  }
  .play #scritta { animation: neonOn 1.5s linear 1.2s both, neonPulse 2.6s ease-in-out 2.8s infinite; }
  @keyframes neonOn {          /* accensione tipo tubo al neon */
    0%   { opacity: 0; }
    6%   { opacity: 1; }
    12%  { opacity: .15; }
    20%  { opacity: 1; }
    28%  { opacity: .3; }
    34%  { opacity: 1; }
    52%  { opacity: 1; }
    56%  { opacity: .45; }
    62%  { opacity: 1; }
    100% { opacity: 1; }
  }
  @keyframes neonPulse {
    0%, 100% { opacity: 1; }
    50%      { opacity: .86; }
  }
  #scritta-link { left: 112px; top: 950px; width: 820px; height: 222px; border-radius: 40px; pointer-events: none; }
  .play #scritta-link { pointer-events: auto; }

  /* ---------- 3) I 6 RETTANGOLI "LIQUID GLASS" ---------- */
  .glass {
    width: 302px; height: 190px; box-sizing: border-box; padding: 22px 30px;
    border-radius: 38px;
    background:
      linear-gradient(135deg, rgba(255,255,255,.42) 0%, rgba(255,255,255,.10) 38%, rgba(255,255,255,.06) 62%, rgba(255,255,255,.30) 100%);
    -webkit-backdrop-filter: blur(18px) saturate(180%) brightness(1.1);
            backdrop-filter: blur(18px) saturate(180%) brightness(1.1);
    border: 1.5px solid rgba(255,255,255,.62);
    box-shadow:
      inset 0 2px 1px rgba(255,255,255,.95),          /* riflesso sul bordo alto */
      inset 0 -2px 2px rgba(255,255,255,.35),
      inset 3px 0 6px rgba(255,255,255,.22),
      inset -3px 0 6px rgba(255,255,255,.22),
      inset 0 -18px 26px rgba(255,255,255,.12),
      0 16px 34px rgba(4,24,74,.42),
      0 2px 6px rgba(4,24,74,.30);
    overflow: hidden;
    opacity: 0; pointer-events: none;
    text-decoration: none;
    transition: filter .15s;
  }
  .glass img {
    position: relative; z-index: 1;
    display: block; width: 100%; height: 100%; object-fit: cover;
    border-radius: 20px;
    box-shadow: 0 3px 10px rgba(4,24,74,.35);
  }
  /* riflesso che scorre sul vetro */
  .glass::after {
    content: ""; position: absolute; z-index: 2; top: -40%; left: -70%; width: 46%; height: 180%;
    background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.55), rgba(255,255,255,0));
    transform: rotate(18deg); pointer-events: none;
  }
  .glass:active { filter: brightness(1.25); }

  .play .glass {
    pointer-events: auto;
    animation: glassIn 1.15s cubic-bezier(.16,.9,.24,1.08) both;
    animation-delay: calc(2.5s + var(--i) * .17s);
  }
  .play .glass::after {
    animation: sheen 4.2s ease-in-out infinite;
    animation-delay: calc(4.2s + var(--i) * .25s);
  }
  @keyframes glassIn {          /* arrivano roteando */
    0%   { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(var(--rot)) scale(.12); }
    35%  { opacity: 1; }
    100% { opacity: 1; transform: none; }
  }
  @keyframes sheen {
    0%, 55% { left: -70%; }
    100%    { left: 150%; }
  }

  /* posizioni: griglia 3 x 2 sopra i sei servizi stampati */
  .g1 { left: 38px;    top: 1173px; --i: 0; --dx: -520px; --dy: -260px; --rot: -720deg; }
  .g2 { left: 349px;   top: 1173px; --i: 1; --dx: 0px;    --dy: -520px; --rot:  720deg; }
  .g3 { left: 660px;   top: 1173px; --i: 2; --dx: 520px;  --dy: -260px; --rot: -720deg; }
  .g4 { left: 38px;    top: 1383px; --i: 3; --dx: -520px; --dy: 300px;  --rot:  720deg; }
  .g5 { left: 349px;   top: 1383px; --i: 4; --dx: 0px;    --dy: 520px;  --rot: -720deg; }
  .g6 { left: 660px;   top: 1383px; --i: 5; --dx: 520px;  --dy: 300px;  --rot:  720deg; }
</style>
</head>
<body>

<!-- Fotocamera + AR -->
<div id="ar"></div>

<!-- Contenuto AR agganciato alla pagina -->
<div id="stage">
  <img id="piramide" src="./piramide_def.png" alt="">

  <div id="plate"></div>
  <div id="flash"></div>
  <img id="scritta" src="./scritta_san_martino_bianca.png" alt="San Martino">
  <a id="scritta-link" href="https://coopsanmartino.it/" aria-label="San Martino Cooperativa"></a>

  <a class="glass g1" href="https://coopsanmartino.it/servizi/servizi-logistici/"><img src="./01_servizi_logistici.svg" alt="Servizi logistici"></a>
  <a class="glass g2" href="https://coopsanmartino.it/servizi/confezionamento/"><img src="./02_confezionamento.svg" alt="Confezionamento"></a>
  <a class="glass g3" href="https://coopsanmartino.it/servizi/sanificazioni/"><img src="./03_sanificazioni.svg" alt="Sanificazioni"></a>
  <a class="glass g4" href="https://coopsanmartino.it/servizi/pulizie-edifici/"><img src="./04_pulizie_edifici.svg" alt="Pulizie edifici"></a>
  <a class="glass g5" href="https://coopsanmartino.it/servizi/manutenzione/"><img src="./05_manutenzione.svg" alt="Manutenzione"></a>
  <a class="glass g6" href="https://coopsanmartino.it/servizi/fiere-ed-eventi/"><img src="./06_fiere_ed_eventi.svg" alt="Fiere ed eventi"></a>
</div>

<!-- Mirino di scansione -->
<div id="scan">
  <div class="frame">
    <span class="c tl"></span><span class="c tr"></span>
    <span class="c bl"></span><span class="c br"></span>
    <span class="line"></span>
  </div>
  <p>Inquadra la pagina</p>
</div>

<!-- Errori -->
<div id="msg"><div>
  <div id="msg-text"></div>
  <button onclick="location.reload()">Riprova</button>
</div></div>

<script type="module">
  import { MindARThree } from 'mindar-image-three';
  import { CSS3DObject } from 'three/addons/renderers/CSS3DRenderer.js';

  const stage = document.getElementById('stage');
  const scan  = document.getElementById('scan');

  function showError(text) {
    document.getElementById('msg-text').textContent = text;
    document.getElementById('msg').classList.add('on');
    scan.classList.add('off');
  }

  async function start() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showError('Questo browser non permette di usare la fotocamera. Apri il link con Safari (iPhone) o Chrome (Android).');
      return;
    }

    const mindar = new MindARThree({
      container: document.getElementById('ar'),
      imageTargetSrc: './targets.mind',
      uiScanning: 'no',          // usiamo il nostro mirino con gli angoli bianchi
      uiLoading: 'yes',
      uiError: 'no',
      missTolerance: 8,          // tollera qualche fotogramma perso prima di nascondere l'AR
      warmupTolerance: 3
    });
    const { renderer, cssRenderer, cssScene, camera } = mindar;

    // la scena HTML viene incollata al target (indice 0 del file targets.mind)
    const anchor = mindar.addCSSAnchor(0);
    anchor.group.add(new CSS3DObject(stage));

    let lostTimer = null;
    anchor.onTargetFound = () => {
      clearTimeout(lostTimer);
      scan.classList.add('off');
      stage.classList.add('play');             // parte la sequenza: piramide → scritta → vetri
    };
    anchor.onTargetLost = () => {
      scan.classList.remove('off');
      // se la pagina resta fuori inquadratura per un po', la sequenza riparte da capo
      lostTimer = setTimeout(() => stage.classList.remove('play'), 2500);
    };

    try {
      await mindar.start();
    } catch (e) {
      console.error(e);
      showError('Per vedere la realtà aumentata devi consentire l\'uso della fotocamera. Controlla i permessi e riprova.');
      return;
    }
    renderer.setAnimationLoop(() => cssRenderer.render(cssScene, camera));

    // quando si torna alla pagina (es. dopo aver aperto un link) la fotocamera riparte
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) return;
      const v = document.querySelector('#ar video');
      if (v && v.paused) v.play().catch(() => location.reload());
    });
  }

  // tornando indietro dal sito, iOS/Android possono mostrare la pagina "congelata": la ricarichiamo
  window.addEventListener('pageshow', (e) => { if (e.persisted) location.reload(); });

  start();
</script>
</body>
</html>
